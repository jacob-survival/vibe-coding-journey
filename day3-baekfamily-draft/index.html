<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백씨네 식탁</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-[radial-gradient(circle_at_top_left,#fde68a_0,#fff7ed_34%,#ffe4e6_100%)] text-stone-800 antialiased">
  <div class="pointer-events-none fixed -left-12 top-14 h-36 w-36 rounded-full bg-orange-200/40 blur-3xl"></div>
  <div class="pointer-events-none fixed -right-10 bottom-16 h-44 w-44 rounded-full bg-rose-200/50 blur-3xl"></div>

  <main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-6 sm:px-6 sm:py-14">
    <section class="w-full max-w-4xl rounded-[1.75rem] border border-orange-100 bg-white/85 px-5 py-8 text-center shadow-2xl shadow-orange-200/50 backdrop-blur sm:rounded-[2.5rem] sm:px-10 sm:py-14">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-orange-100 to-rose-100 text-3xl shadow-inner shadow-orange-200 sm:mb-5 sm:h-20 sm:w-20 sm:text-4xl">
        🍚
      </div>

      <p class="mb-3 inline-flex items-center rounded-full bg-orange-100 px-3 py-2 text-xs font-bold text-orange-600 sm:px-4 sm:text-base">
        🍽️ 함께 고르는 우리 집 저녁
      </p>

      <h1 class="text-3xl font-extrabold tracking-tight text-stone-900 min-[390px]:text-4xl sm:text-6xl">
        백씨네 식탁
      </h1>

      <p class="mt-3 text-base font-semibold text-stone-700 min-[390px]:text-lg sm:text-2xl">
        엄마 저녁밥 뭐에요?
      </p>

      <button
        type="button"
        class="mt-7 min-h-14 w-full max-w-xs rounded-full bg-gradient-to-r from-orange-400 via-amber-400 to-rose-400 px-9 py-4 text-base font-bold text-white shadow-lg shadow-orange-300/50 transition hover:from-orange-500 hover:via-amber-500 hover:to-rose-500 active:scale-95 sm:mt-8 sm:min-h-14 sm:w-auto sm:px-11 sm:text-lg"
      >
        메뉴 보기
      </button>

      <section class="mt-10 sm:mt-14">
        <h2 class="text-xl font-extrabold text-stone-900 min-[390px]:text-2xl sm:text-3xl">
          오늘의 메뉴 후보
        </h2>
        <p class="mt-2 text-sm font-medium text-stone-500 sm:text-base">
          마음에 드는 메뉴에 따뜻한 한 표를 남겨보세요.
        </p>

        <div class="mt-6 grid grid-cols-1 gap-3 sm:gap-4 md:grid-cols-3 md:gap-5">
          <article class="menu-card rounded-3xl border-2 border-orange-100/70 bg-white/90 p-5 shadow-lg shadow-orange-100/60 transition md:hover:-translate-y-1 md:hover:shadow-xl md:hover:shadow-orange-200/50 sm:p-6">
            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-orange-50 text-3xl sm:h-16 sm:w-16 sm:text-4xl">🥓</div>
            <h3 class="mt-4 text-lg font-extrabold text-stone-900 sm:mt-5 sm:text-xl">삼겹살구이</h3>
            <p class="mt-2 text-sm font-medium leading-relaxed text-stone-500">노릇하게 구워 상추쌈과 함께 먹기 좋은 가족 인기 메뉴예요.</p>
            <button
              type="button"
              class="like-button mt-4 min-h-12 w-full touch-manipulation rounded-full bg-rose-100 px-7 py-2 text-sm font-bold text-rose-600 transition hover:bg-rose-200 active:scale-95 sm:mt-5 sm:w-auto"
            >
              좋아요
            </button>
          </article>

          <article class="menu-card rounded-3xl border-2 border-orange-100/70 bg-white/90 p-5 shadow-lg shadow-orange-100/60 transition md:hover:-translate-y-1 md:hover:shadow-xl md:hover:shadow-orange-200/50 sm:p-6">
            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-orange-50 text-3xl sm:h-16 sm:w-16 sm:text-4xl">🍲</div>
            <h3 class="mt-4 text-lg font-extrabold text-stone-900 sm:mt-5 sm:text-xl">김치찌개</h3>
            <p class="mt-2 text-sm font-medium leading-relaxed text-stone-500">칼칼하고 따뜻한 국물로 밥 한 공기 뚝딱 먹기 좋아요.</p>
            <button
              type="button"
              class="like-button mt-4 min-h-12 w-full touch-manipulation rounded-full bg-rose-100 px-7 py-2 text-sm font-bold text-rose-600 transition hover:bg-rose-200 active:scale-95 sm:mt-5 sm:w-auto"
            >
              좋아요
            </button>
          </article>

          <article class="menu-card rounded-3xl border-2 border-orange-100/70 bg-white/90 p-5 shadow-lg shadow-orange-100/60 transition md:hover:-translate-y-1 md:hover:shadow-xl md:hover:shadow-orange-200/50 sm:p-6">
            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-orange-50 text-3xl sm:h-16 sm:w-16 sm:text-4xl">🍗</div>
            <h3 class="mt-4 text-lg font-extrabold text-stone-900 sm:mt-5 sm:text-xl">닭볶음탕</h3>
            <p class="mt-2 text-sm font-medium leading-relaxed text-stone-500">감자와 닭고기가 듬뿍 들어가 든든한 저녁으로 잘 어울려요.</p>
            <button
              type="button"
              class="like-button mt-4 min-h-12 w-full touch-manipulation rounded-full bg-rose-100 px-7 py-2 text-sm font-bold text-rose-600 transition hover:bg-rose-200 active:scale-95 sm:mt-5 sm:w-auto"
            >
              좋아요
            </button>
          </article>
        </div>
      </section>
    </section>
  </main>

  <script>
    const likeButtons = document.querySelectorAll(".like-button");

    likeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const card = button.closest(".menu-card");

        card.classList.remove("border-orange-100/70", "shadow-orange-100/60");
        card.classList.add("border-orange-400", "bg-orange-50/80", "shadow-orange-200");
        button.classList.remove("bg-rose-100", "text-rose-600");
        button.classList.add("bg-orange-100", "text-orange-700");
        button.textContent = "❤️ 좋아요!";
      });
    });
  </script>
</body>
</html>
